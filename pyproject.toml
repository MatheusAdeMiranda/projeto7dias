[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI depende de `Depends()` em default de parametro
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B017"]
